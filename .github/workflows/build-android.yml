# 构建 Android APK (GitHub Actions 云构建)
# android/ 由 CI 自动生成，不提交到 Git

name: Build Android APK

on:
  push:
    branches: [app]
  pull_request:
    branches: [app]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.0.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Build web assets
        run: npm run build
      
      - name: Generate Android project
        run: bash scripts/setup-android.sh
        env:
          CI: true
      
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --quiet
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
      
      - name: Build Staging APK
        run: |
          cd android
          ./gradlew assembleStaging --no-daemon --quiet
        continue-on-error: true
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Staging APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-staging-apk
          path: android/app/build/outputs/apk/staging/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Show build summary
        if: always()
        run: |
          echo "=== Build Results ==="
          ls -lh android/app/build/outputs/apk/debug/*.apk 2>/dev/null && echo "Debug APK OK" || echo "No Debug APK"
          ls -lh android/app/build/outputs/apk/staging/*.apk 2>/dev/null && echo "Staging APK OK" || echo "No Staging APK"
